<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chord Dictionary — NoteByNote</title>
  <link rel="stylesheet" href="/pages/css/global.css" />
  <link rel="stylesheet" href="/pages/css/chords.css" />
  <style>
    .instrument-section {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      margin-bottom: 12px;
    }
 
    .instrument-toggle {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px;
      background: var(--bg2);
      border: none;
      cursor: pointer;
      transition: background 0.15s;
      gap: 12px;
    }
    .instrument-toggle:hover { background: var(--bg3); }
 
    .instrument-toggle-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }
 
    .instrument-label {
      font-family: var(--font-serif);
      font-size: 1rem;
      font-weight: 600;
      color: var(--text);
    }
 
    .instrument-count {
      font-family: var(--font-serif);
      font-size: 1rem;
      color: var(--text3);
      letter-spacing: 0.05em;
    }
 
    .instrument-arrow {
      font-size: 0.65rem;
      color: var(--text3);
      transition: transform 0.2s ease;
      flex-shrink: 0;
    }
    .instrument-toggle.open .instrument-arrow {
      transform: rotate(180deg);
    }
 
    .instrument-body {
      display: none;
      border-top: 1px solid var(--border);
      padding: 18px;
      background: var(--bg);
    }
    .instrument-body.open { display: block; }
 
    .instrument-body .dict-grid {
      margin: 0;
    }
  </style>
</head>

<script>
  function toggleSection(button){
    button.classList.toggle('open');
    button.nextElementSibling.classList.toggle('open');
  }
</script>


<body>

  <nav class="navbar">
    <ul class="navbar-links">
      <li><a href="/pages/index.html" class="nav-link" data-page="home"><span class="star-wrap"><img src="/pages/images/navbarStar.png" class="nav-star" alt="star"></span>Home</a></li>
      <li><a href="/pages/songs.html" class="nav-link" data-page="songs"><span class="star-wrap"><img src="/pages/images/navbarStar.png" class="nav-star" alt="star"></span>Songs</a></li>
      <li><a href="/pages/chords.html" class="nav-link" data-page="chords"><span class="star-wrap"><img src="/pages/images/navbarStar.png" class="nav-star" alt="star"></span>Chord Dictionary</a></li>
      <li><a href="/pages/about.html" class="nav-link" data-page="about"><span class="star-wrap"><img src="/pages/images/navbarStar.png" class="nav-star" alt="star"></span>About</a></li>
    </ul>
  </nav>

  <div class="page-inner">
    <h2 class="page-heading">Chord Dictionary</h2>
    <p class="page-subheading">Finger positions for different instruments used in NoteByNote.</p>

    <!--Flute-->
     <div class="instrument-section">
      <button class="instrument-toggle" onclick="toggleSection(this)">
        <span class="instrument-toggle-left">
          <span class="instrument-label">Flute</span>
          <span class="instrument-count" id="count-flute"> - Fingering Chart</span>
        </span>
        <span class="instrument-arrow">▼</span>
      </button>
      <div class="instrument-body">
        <img src="/pages/assets/flute.png" alt="Flute Fingering Chart" class="fingering-chart"/>
        <div class="dict-grid" id="dict-grid-flute"></div>
      </div>
    </div>

    <!--Guitar-->
    <div class="instrument-section">
      <button class="instrument-toggle" onclick="toggleSection(this)">
        <span class="instrument-toggle-left">
          <span class="instrument-label">Guitar</span>
          <span class="instrument-count" id="count-guitar"> - Chord Fingerings </span>
        </span>
        <span class="instrument-arrow">▼</span>
      </button>
      <div class="instrument-body">
        <img src="/pages/assets/guitar.png" alt="Guitar Chord Chart" class="fingering-chart"/>
        <div class="dict-grid" id="dict-grid-guitar"></div>
      </div>
    </div>

    <!--Piano-->
    <div class="instrument-section">
      <button class="instrument-toggle" onclick="toggleSection(this)">
        <span class="instrument-toggle-left">
          <span class="instrument-label">Piano</span>
          <span class="instrument-count" id="count-piano"> - Fingering Diagram </span>
        </span>
        <span class="instrument-arrow">▼</span>
      </button>
      <div class="instrument-body">
        <img src="/pages/assets/piano.png" alt="Piano Chord Chart" class="fingering-chart"/>
        <div class="dict-grid" id="dict-grid-piano"></div>
      </div>
    </div>




  </div> 
  <script src="/pages/js/data.js"></script>
  <script src="/pages/js/chordDiagram.js"></script>
  <script src="/pages/js/navbar.js"></script>
  <script src="/pages/js/chords.js"></script>
</body>
</html>
